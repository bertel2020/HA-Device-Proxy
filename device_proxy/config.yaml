name: Device Proxy
version: "1.3.0"
slug: device_proxy
description: Shares serial, USB, Modbus and EnOcean devices with several programs (ser2net 4, Modbus and EnOcean proxy)
url: https://github.com/bertel2020/HA-Device-Proxy
arch:
  - aarch64
  - amd64
# prebuilt by CI (job "Publish image") for every version on main; the Supervisor pulls it
# instead of building gensio and ser2net on the device
image: ghcr.io/bertel2020/{arch}-device_proxy
init: false
# before the apps that connect to the devices (e.g. Z-Wave JS UI)
startup: services
# the TCP ports (also 502 for Modbus) are chosen per connection, so the app listens on the
# host directly
host_network: true
uart: true
usb: true
# devices that are plugged in again while the app runs
udev: true
ingress: true
ingress_port: 18399
panel_icon: mdi:lan-connect
panel_title: Device Proxy
map:
  - type: addon_config
    read_only: false
# the history is SQLite with a WAL: write it into the main file first
backup_pre: python3 -m device_proxy.backup
# recorded traces and EnOcean captures (up to 50 MB each) stay out of the backups; both
# patterns, so they match the folder with and without the leading part of the path
backup_exclude:
  - "trace/*"
  - "*/trace/*"
# the host's LAN address for the addresses shown to clients
hassio_api: true
# notifications in Home Assistant
homeassistant_api: true
# EnOcean gateways are offered to the EnOcean Eltako integration
discovery:
  - enocean_eltako
# the MQTT broker for the entities, when there is one
services:
  - mqtt:want
# everything is set in the app's web interface
