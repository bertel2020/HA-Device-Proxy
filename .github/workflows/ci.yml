name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -q

  panel:
    name: Web interface bundle up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
        working-directory: panel-src
      - run: node build.mjs --check
        working-directory: panel-src

  lint:
    name: App linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2
        with:
          path: ./device_proxy

  build:
    name: Test build (${{ matrix.arch }})
    # each architecture on a runner of its own: aarch64 under QEMU took over 10 minutes
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the app image (not pushed; the Supervisor builds it on install)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: device_proxy
          platforms: ${{ matrix.platform }}
          push: false
          # gensio, ser2net and the wheels are built again only when the Dockerfile or
          # requirements.txt change; shared with the integration test and the publish job
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-python:3.14-alpine3.24

  integration:
    # the app against the real ser2net in the built image, with ptys as devices
    name: Integration test (ser2net)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: device_proxy
          load: true
          tags: device-proxy:test
          cache-from: type=gha,scope=amd64
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.14-alpine3.24
      - name: Run the checks inside the image
        run: >-
          docker run --rm -v "$PWD/tests/integration:/test:ro" --entrypoint sh device-proxy:test
          -c "apk add --no-cache socat >/dev/null && timeout 120 python3 /test/check_ser2net.py"

  publish:
    # Prebuilt images, so the Supervisor pulls instead of building on the device. Runs on
    # main for a version not published yet; config.yaml's "image" points here once the
    # packages are public (GitHub → Packages → Package settings → Change visibility).
    name: Publish image (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [tests, panel, lint, build, integration]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version from config.yaml
        id: version
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' device_proxy/config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Already published?
        id: exists
        run: |
          image=ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-device_proxy
          if docker manifest inspect "$image:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.exists.outputs.skip != 'true'
      - name: Build and push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: device_proxy
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-device_proxy:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-device_proxy:latest
          labels: |
            io.hass.name=Device Proxy
            io.hass.type=addon
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-python:3.14-alpine3.24
            BUILD_VERSION=${{ steps.version.outputs.version }}
