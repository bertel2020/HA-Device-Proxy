name: Ser2Net
version: "0.1.0"
slug: ser2net
description: Shares serial and USB devices over TCP with several programs (ser2net 4)
url: https://github.com/bertel2020/HA-Ser2Net
arch:
  - aarch64
  - amd64
init: false
# before the apps that connect to the devices (e.g. Z-Wave JS UI)
startup: services
# the TCP ports are chosen per connection, so the app listens on the host directly
host_network: true
uart: true
usb: true
# devices that are plugged in again while the app runs
udev: true
ingress: true
ingress_port: 18399
panel_icon: mdi:serial-port
panel_title: Ser2Net
map:
  - type: addon_config
    read_only: false
# the history is SQLite with a WAL: write it into the main file first
backup_pre: python3 -m ser2net_app.backup
# the host's LAN address for the addresses shown to clients
hassio_api: true
# notifications in Home Assistant
homeassistant_api: true
# everything is set in the app's web interface
options: {}
schema: {}
